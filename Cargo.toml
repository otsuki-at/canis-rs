[package]
name = "canis"
version = "0.1.0"
edition = "2024"

[dependencies]
notify = { git = "https://github.com/otsuki-at/notify.git", rev="46d14fd3081cfc3727d0b8964a9b964a82b9e434"}
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories-next = "2.0"
sha2 = "0.10"
anyhow = "1"
hex = "0.4"
libc = "0.2"
ctrlc = "3.4"
clap = { version = "4.5", features = ["derive"] }
whoami = "1"
dialoguer = "0.11"
ureq = "2"
serde_json   = "1"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
sysinfo = {version = "0.38.4"}

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
daemonize = "0.5"
nix = { version = "0.29", features = ["signal"] }
fuser = {version = "0.14", optional = true}

[features]
default = []
fuse = ["fuser"]
