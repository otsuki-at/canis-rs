name: Release binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and upload (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release --no-default-features

      - name: Prepare release artifact
        shell: bash
        run: |
          set -e

          NAME="canis"
          VERSION="${{ github.ref_name }}"

          mkdir -p dist

          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)          ARCH="x64" ;;
            aarch64 | arm64) ARCH="arm64" ;;
          esac

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/release/${NAME}.exe" "dist/${NAME}-windows-${ARCH}-${VERSION}.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp "target/release/${NAME}" "dist/${NAME}-macos-${ARCH}-${VERSION}"
          else
            cp "target/release/${NAME}" "dist/${NAME}-linux-${ARCH}-${VERSION}"
          fi

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
